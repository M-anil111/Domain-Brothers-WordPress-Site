name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint every PHP file
        run: |
          fail=0
          for f in db-custom-blocks/*.php db-custom-blocks/pagecache/*.php db-custom-blocks/designer/*.php; do
            php -l "$f" > /dev/null || { echo "FAIL $f"; fail=1; }
          done
          exit $fail

      - name: Check JavaScript syntax
        run: |
          fail=0
          for f in db-custom-blocks/assets/*.js db-custom-blocks/designer/assets/js/*.js; do
            [ -f "$f" ] && { node --check "$f" || { echo "FAIL $f"; fail=1; }; }
          done
          exit $fail

      - name: Check header and loader versions match
        run: |
          h=$(sed -n 's/^ \* Version: *//p' db-custom-blocks/db-custom-blocks.php | head -1)
          l=$(sed -n "s/.*'DB_BLOCKS_LOADED', '\(.*\)'.*/\1/p" db-custom-blocks/db-custom-blocks.php | head -1)
          echo "header=$h loader=$l"
          [ -n "$h" ] && [ "$h" = "$l" ]

      - name: Offline tests
        run: |
          fail=0
          for t in tests/pages/pages-test.php tests/pages/service-redirects-test.php \
                   tests/plan/plan-lifecycle-test.php tests/plan/plan-schedule-test.php \
                   tests/seo/html-hygiene-test.php tests/seo/title-test.php tests/spam/spam-test.php \
                   tests/consent/consent-test.php tests/consent/footer-links-test.php \
                   tests/security/forms-test.php tests/security/test-data-test.php \
                   tests/hygiene/hygiene-test.php tests/hygiene/learn-test.php \
                   tests/hygiene/resolve-test.php tests/hygiene/alert-test.php tests/hygiene/similar-test.php tests/hygiene/events-test.php tests/hygiene/account-data-test.php tests/hygiene/hero-test.php tests/domain/domain-tools-test.php tests/domain/lookup-dns-test.php tests/security/query-arrays-test.php tests/security/offer-token-test.php tests/security/money-test.php tests/hygiene/page-actions-test.php tests/hygiene/offer-page-test.php tests/designer/ui-fixes-test.php tests/seller/seller-test.php \
                   tests/seo/crawl-test.php tests/seo/schema-test.php tests/a11y/home-landmark-test.php tests/seo/top10-archive-test.php tests/domain/index-recursion-test.php tests/hygiene/webfont-strip-test.php; do
            echo "== $t"
            php "$t" || fail=1
          done
          exit $fail

      - name: SEO checker rules (offline)
        run: python3 tests/seo/seo-check-test.py

      - name: Tool page data is complete
        run: |
          php -r 'define("ABSPATH",1); $d=include "db-custom-blocks/db-tool-pages-data.php"; $bad=0;
          foreach($d as $k=>$p){ foreach(["name","title","meta","kw","lead","button","steps","sections","faqs","related"] as $f){ if(empty($p[$f])){echo "MISSING $k.$f\n";$bad=1;} }
            foreach($p["related"] as $r){ if(!isset($d[$r])){echo "BAD RELATED $k->$r\n";$bad=1;} }
            if(strlen($p["meta"])>160){echo "LONG META $k\n";$bad=1;} }
          exit($bad);'
